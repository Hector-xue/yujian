[project]
name = "yujian-server"
version = "0.5.0"
description = "余见可选服务端：同步中继 + 加密备份 + 设备管理。不含账本规则。"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
