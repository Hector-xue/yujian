name: release
# 打 tag v* → 签名 release apk + web 包 → GitHub Release。缺签名 Secret 直接失败，不出没签名的包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  desktop-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/yujian
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsqlite3-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: mcp server bundle
        working-directory: packages/mcp_server
        run: dart pub get && dart build cli --target bin/yujian_mcp.dart -o build/mcp
      - name: package
        run: |
          ver=${GITHUB_REF_NAME#v}
          (cd build/linux/x64/release/bundle && tar czf "../../../../../yujian-${ver}-linux-x64.tar.gz" .)
          (cd ../../packages/mcp_server/build/mcp/bundle && tar czf "$GITHUB_WORKSPACE/apps/yujian/yujian-mcp-${ver}-linux-x64.tar.gz" .)
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/yujian/yujian-*-linux-x64.tar.gz
            apps/yujian/yujian-mcp-*-linux-x64.tar.gz

  desktop-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/yujian
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --project-name yujian --org com.ivyea .
      - run: Copy-Item branding\app_icon.ico windows\runner\resources\app_icon.ico -Force
      - run: flutter pub get
      - run: flutter build windows --release
      - name: mcp server bundle
        working-directory: packages/mcp_server
        run: dart pub get && dart build cli --target bin/yujian_mcp.dart -o build/mcp
      - name: package
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "yujian-$ver-windows-x64.zip"
          Compress-Archive -Path ..\..\packages\mcp_server\build\mcp\bundle\* -DestinationPath "yujian-mcp-$ver-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/yujian/yujian-*-windows-x64.zip
            apps/yujian/yujian-mcp-*-windows-x64.zip

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/yujian
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: restore keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KS_B64" -a -n "$KS_PASSWORD" -a -n "$KS_ALIAS" || { echo "missing signing secrets"; exit 1; }
          echo "$KS_B64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOT
          storeFile=release.keystore
          storePassword=$KS_PASSWORD
          keyAlias=$KS_ALIAS
          keyPassword=$KS_PASSWORD
          EOT
      - run: ../../scripts/check_version.sh "${GITHUB_REF_NAME}"
        if: startsWith(github.ref, 'refs/tags/')
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: sqlite3.wasm for web
        run: |
          ver=$(awk '/^  sqlite3:$/{f=1} f&&/^    version:/{gsub(/[" ]/,"",$2); print $2; exit}' pubspec.lock)
          curl -sSfL -o web/sqlite3.wasm "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-${ver}/sqlite3.wasm"
      - run: flutter build web --release --base-href /
      - run: flutter build apk --release --split-per-abi
      - name: verify signature
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk" | grep -i "SHA-256" | head -1
      - name: package
        run: |
          ver=${GITHUB_REF_NAME#v}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "yujian-${ver}-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "yujian-${ver}-android-arm32.apk"
          (cd build/web && zip -qr "../../yujian-${ver}-web.zip" .)
          ls -la yujian-*
      - name: release notes from CHANGELOG
        working-directory: ${{ github.workspace }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          # 取 CHANGELOG 里 "## <ver>" 到下一个 "## " 之间的正文；App 内更新弹窗直接显示这段
          awk -v v="$ver" '/^## /{p = index($0, "## " v " ") == 1 || $0 == "## " v} p' CHANGELOG.md | tail -n +2 > release-notes.md
          [ -s release-notes.md ] || echo "余见 $ver" > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/yujian/yujian-*-android-*.apk
            apps/yujian/yujian-*-web.zip
          body_path: release-notes.md
