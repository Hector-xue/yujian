name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test packages/ledger_core
