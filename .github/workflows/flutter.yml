name: flutter
on:
  push:
    branches: [main]
    paths: ['apps/yujian/**', 'packages/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['apps/yujian/**', 'packages/**']
  workflow_dispatch:
jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 打样分支把 debug APK 挂到预发布上（Actions 产物配额常年是满的）
    defaults:
      run:
        working-directory: apps/yujian
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      # runner 盘只有 ~14G 空余：llamadart 的原生包（每个 ABI 解压 + 拷进 APK）加上 web / apk 两个产物会撞满。先把用不到的预装件清掉（.NET / Haskell / CodeQL / boost，约 20G）
      - name: free disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" /usr/local/lib/node_modules || true
          df -h / | tail -1
      - run: ../../scripts/check_version.sh
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: df -h / | tail -1
      - name: sqlite3.wasm for web
        run: |
          ver=$(awk '/^  sqlite3:$/{f=1} f&&/^    version:/{gsub(/[" ]/,"",$2); print $2; exit}' pubspec.lock)
          echo "sqlite3 $ver"
          curl -sSfL -o web/sqlite3.wasm "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-${ver}/sqlite3.wasm"
      - run: flutter build web --release --base-href /
      # 产物只是走查用的，留 3 天；仓库 Actions 存储配额有限（曾因 200 多份 130MB 的 debug apk 撞满配额把 CI 判失败），上传失败不算 CI 失败
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: web
          path: apps/yujian/build/web
          retention-days: 3
      - run: rm -rf build/web && flutter build apk --debug && df -h / | tail -1
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: apk-debug
          path: apps/yujian/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
      # 打样分支：Actions 产物配额撞满时拿不到 APK，改挂到一个预发布上（每次覆盖），真机装这个测
      - name: spike prerelease
        if: github.head_ref == 'spike/local-model'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk yujian-spike-local-model-debug.apk
          gh release delete spike-local-model --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create spike-local-model yujian-spike-local-model-debug.apk --prerelease --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY" \
            --title "本地模型打样 debug APK（不是正式版）" \
            --notes "spike/local-model 的 debug 包，只为真机跑「更多 → AI → 本地模型（打样）」拿数字。commit ${GITHUB_SHA::7}" 
